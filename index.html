<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario con localStorage</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Formulario de contacto</h1>
    <p>Ejercicio para practicar cómo guardar datos en el navegador.</p>
    <form id="container-form">
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
      <div id="send"><button id="button-send" type="submit">Guardar en este navegador</button></div>
      <p id="resultado" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="./script.js"></script>
</body>
</html>
